<style>
:root{
  --inkt:#0d0f11;
  --karton:#171b1f;
  --karton2:#1f242a;
  --papier:#ccd1cd;
  --papier2:#b9bfba;
  --lijn:#2c3238;
  --rood:#b8352b;
  --potlood:#5e665f;
  --tekst:#c8cec9;
  --dof:#9aa39c;
  --wit:#eef1ee;
  --kop:'Haettenschweiler','Arial Narrow Bold','Arial Narrow',Impact,sans-serif;
  --serif:Georgia,'Times New Roman',serif;
  --mono:'Courier New',Courier,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--inkt);color:var(--tekst);font-family:var(--serif)}
body{overscroll-behavior:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden}

/* ── de zwarte kolom: voortgangsbalk ───────────────────────── */
#kolom{position:absolute;left:0;top:0;bottom:0;width:10px;background:#000;
  border-right:1px solid var(--lijn);display:flex;flex-direction:column;z-index:5}
#kolom .seg{flex:1;border-bottom:1px solid var(--lijn);background:#000;transition:background .6s}
#kolom .seg.vol{background:repeating-linear-gradient(180deg,var(--papier) 0 3px,#8f958f 3px 6px)}
#blad{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 0 40px 10px;
  -webkit-overflow-scrolling:touch;scroll-behavior:smooth}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}

/* ── typografie ────────────────────────────────────────────── */
h1,h2,h3{font-family:var(--kop);font-weight:normal;letter-spacing:.06em;
  text-transform:uppercase;color:var(--wit);margin:0}
h1{font-size:clamp(30px,9vw,54px);line-height:.95}
h2{font-size:clamp(21px,5.4vw,30px);line-height:1.05}
h3{font-size:15px;letter-spacing:.12em;color:#b3bab4}
p{line-height:1.62;font-size:16px;margin:0 0 14px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;
  color:#e0705f;margin:0 0 8px}
.stempel{font-family:var(--mono);font-size:12.5px;letter-spacing:.08em;color:var(--dof)}
hr.rule{border:0;border-top:1px solid var(--lijn);margin:26px 0}

/* ── knoppen ───────────────────────────────────────────────── */
button{font-family:var(--mono);font-size:13px;letter-spacing:.08em;text-transform:uppercase;
  background:transparent;color:var(--wit);border:1px solid var(--papier2);padding:12px 18px;
  cursor:pointer;transition:background .15s,color .15s}
button:hover:not(:disabled){background:var(--papier);color:var(--inkt)}
button:focus-visible{outline:2px solid var(--rood);outline-offset:2px}
button:disabled{opacity:.35;cursor:default}
button.primair{background:var(--rood);border-color:var(--rood);color:#fff}
button.primair:hover:not(:disabled){background:#d0453a;color:#fff}
.knoppen{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}

/* ── scènes ────────────────────────────────────────────────── */
.scene{display:block;width:100%;height:auto;border:1px solid var(--lijn);background:#0b0d0f}
.hero{margin:0 0 24px}
.strook{margin:0 0 20px}
.hero .regel{opacity:0;animation:zetten .5s ease forwards}
.hero .zwart{opacity:0;animation:zetten .9s ease 1.5s forwards}
@keyframes zetten{from{opacity:0;transform:translateX(-9px)}to{opacity:1;transform:none}}
.hero .lamp{animation:flikker 8s infinite}
@keyframes flikker{0%,90%,100%{opacity:1}91%{opacity:.68}92%{opacity:1}95%{opacity:.82}96%{opacity:1}}
.hero .stof{animation:zweef 11s linear infinite}
@keyframes zweef{0%{transform:translateY(0);opacity:0}25%{opacity:.4}100%{transform:translateY(-80px);opacity:0}}
.knipper,.spleet{animation:pols 3.6s ease-in-out infinite}
@keyframes pols{0%,100%{opacity:1}50%{opacity:.42}}
.golf{animation:deining 7s ease-in-out infinite}
@keyframes deining{0%,100%{transform:translateX(0)}50%{transform:translateX(-26px)}}

/* ── iconen ────────────────────────────────────────────────── */
.ico{width:22px;height:22px;flex:0 0 auto;filter:drop-shadow(0 1px 1px rgba(0,0,0,.65))}
.kaart .kop{display:flex;align-items:center;gap:9px;margin-bottom:5px;color:var(--rood)}
.kaart .kop .ico{width:26px;height:26px}

/* ── kast / zaakladen ──────────────────────────────────────── */
#kast{padding-top:44px}
.lade{display:block;width:100%;text-align:left;border:1px solid var(--lijn);background:var(--karton);
  padding:16px 18px;margin-bottom:12px;color:var(--tekst);cursor:pointer;
  font-family:var(--serif);text-transform:none;letter-spacing:normal;font-size:16px}
.lade:hover:not(:disabled){background:var(--karton2);color:var(--tekst)}
.lade .nr{font-family:var(--kop);font-size:26px;color:var(--rood);letter-spacing:.05em;
  display:block;line-height:1}
.lade .tt{font-family:var(--kop);font-size:22px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--wit);display:block;margin:4px 0 6px}
.lade .sub{font-family:var(--mono);font-size:12.5px;letter-spacing:.04em;color:var(--dof)}
.lade[data-op="1"] .tt::after{content:' ✓';color:var(--rood)}
.lade:disabled{opacity:.4}

/* ── kaarten ───────────────────────────────────────────────── */
.kaarten{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin:12px 0 4px}
.kaart{border:1px solid var(--lijn);background:var(--karton);padding:12px 13px}
.kaart .nm{font-family:var(--serif);font-size:17.5px;font-weight:bold;letter-spacing:.01em;
  color:var(--wit);display:block;line-height:1.25}
.kaart .dt{font-family:var(--mono);font-size:12.5px;letter-spacing:.02em;color:#e0705f;
  display:block;margin-bottom:8px}
.kaart .om{font-size:15px;line-height:1.55;color:#aab2ab;margin:0}

/* ── aanwijzingen ──────────────────────────────────────────── */
ol.clues{list-style:none;margin:10px 0 0;padding:0;counter-reset:c}
ol.clues li{counter-increment:c;position:relative;padding:12px 13px 12px 48px;
  border:1px solid var(--lijn);border-bottom:0;background:var(--karton);cursor:pointer;font-size:16px;
  line-height:1.55}
ol.clues li:last-child{border-bottom:1px solid var(--lijn)}
ol.clues li::before{content:counter(c);position:absolute;left:0;top:0;bottom:0;width:36px;
  display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:13.5px;
  color:var(--dof);border-right:1px solid var(--lijn)}
ol.clues li.af{color:var(--potlood);text-decoration:line-through;text-decoration-color:var(--rood)}
ol.clues li.lijk{background:#20140f;border-color:#43241c;color:var(--wit);cursor:default}
ol.clues li.lijk::before{content:'✱';color:var(--rood)}

/* ── rooster ───────────────────────────────────────────────── */
#roosterbox{margin:14px 0 0;border:1px solid var(--lijn);background:var(--papier);
  padding:10px;overflow-x:auto;-webkit-overflow-scrolling:touch}
table.rooster{border-collapse:collapse;margin:0 auto;table-layout:auto}
table.rooster td,table.rooster th{padding:0;border:0}
.cel{width:30px;height:30px;border:1px solid #9aa19b;background:#e4e7e3;cursor:pointer;
  font-family:var(--mono);font-size:17px;line-height:1;color:var(--potlood);text-align:center;
  vertical-align:middle;user-select:none;padding:0}
.cel:hover{background:#f2f4f1}
.cel.v{color:var(--rood);font-weight:bold}
.cel.bl{border-left:2px solid #4a524c}
.cel.bt{border-top:2px solid #4a524c}
.rijlabel{font-family:var(--mono);font-size:11.5px;letter-spacing:0;color:#1b201d;
  padding:0 8px 0 2px;white-space:nowrap;
  position:sticky;left:0;background:var(--papier);z-index:2}
.rijlabel .in{display:flex;align-items:center;justify-content:flex-end;gap:6px}
.rijlabel .ico{width:19px;height:19px;filter:none}
.kolabel{height:116px;vertical-align:bottom;padding-bottom:4px;text-align:center}
.kolabel .tx{writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--mono);
  font-size:11.5px;letter-spacing:0;color:#1b201d;display:inline-block}
.kolabel .ico{width:20px;height:20px;color:#232825;filter:none;display:block;margin:0 auto 4px}
.catlabel{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:#454c47;
  text-transform:uppercase;padding:0 6px 4px 0;text-align:right}
.hoek{background:transparent}

/* ── conclusie ─────────────────────────────────────────────── */
.formulier{border:1px solid var(--lijn);background:var(--karton);padding:16px;margin-top:16px}
.veld{display:flex;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.veld label{font-family:var(--mono);font-size:13px;letter-spacing:.06em;color:#e0705f;
  text-transform:uppercase;min-width:74px}
.veld select{flex:1;min-width:180px;background:var(--karton2);color:var(--wit);border:1px solid var(--lijn);
  padding:10px;font-family:var(--serif);font-size:15px}
.uitslag{margin-top:14px;padding:13px;border-left:3px solid var(--rood);background:#1b1417;
  font-size:15px;line-height:1.55;display:none}
.uitslag.zicht{display:block}

/* ── onthulling ────────────────────────────────────────────── */
#onthulling{display:none;margin-top:24px;border-top:1px solid var(--rood);padding-top:20px}
#onthulling.zicht{display:block;animation:opkomst .8s ease both}
@keyframes opkomst{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.oplos{font-family:var(--mono);font-size:14.5px;letter-spacing:.02em;color:var(--wit);
  border:1px solid var(--rood);padding:12px;margin:0 0 18px;line-height:1.9;background:#1b1417}
.oplos b{color:#e0705f;letter-spacing:.06em}

.hoofd{padding:26px 0 6px;border-bottom:1px solid var(--lijn);margin-bottom:18px}
.terug{font-family:var(--mono);font-size:12.5px;letter-spacing:.08em;color:var(--dof);
  background:none;border:0;padding:12px 0;cursor:pointer;text-transform:uppercase}
.terug:hover{color:var(--wit);background:none}
.scherm{display:none}
.scherm.actief{display:block}
.mini{font-family:var(--mono);font-size:12.5px;color:var(--dof);letter-spacing:.02em}
#geluidknop{position:absolute;right:10px;top:10px;z-index:6;border:1px solid var(--lijn);
  padding:8px 11px;font-size:11.5px;letter-spacing:.04em;background:var(--inkt)}
@media (max-width:520px){
  .cel{width:26px;height:26px;font-size:15px}
  .kolabel{height:38px}
  .kolabel .tx{display:none}
  .rijlabel .lb{display:none}
  .wrap{padding:0 12px}
  p{font-size:15px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .hero .regel,.hero .zwart{opacity:1}
}
</style>

const DATA = {"serie":{"titel":"The Black Column","onder":"Three nights \u00b7 November 1958 \u00b7 The Evening Sentinel","intro":["On the 12th of November 1958 an eight-page section is pulled off the presses. It appears on no schedule anywhere, it carries no by-line, and before that night is out it has vanished from the archive cellar.","Over the three nights that follow, three people die. Each time there is one suspect who did it, one object, one place. Beyond that there is nothing: no witness who will talk, no confession, no name.","What you do have is a grid. Every suspect belongs to exactly one object and exactly one place \u2014 never to two. Cross out what cannot be true, and what is left is what happened."],"hoe":["Tap a square to cycle it: empty, cross (cannot be) and tick (is so).","Place a tick and the grid crosses out the rest of that row and column for you.","Every clue is true. Every clue is needed. There is exactly one solution."]},"epiloog":["Three nights, three dead, one eight-page section that was never run.","The negatives were never recovered. The following week the type was melted down into fresh lines; the paper came out that month as it always did, every day, on time.","The archive holds the 1958 volume complete. Only between the 12th and the 13th of November is there a gap the size of eight pages. Open the binder and you are looking at white space \u2014 and white space, as the advertising manager liked to say, is something we sell."],"zaken":[{"code":"I","titel":"The Night Run","nacht":"Night of the 12th to 13th of November","plek":"The Swan Printing Works, Wharf Road","intro":["At a quarter past three the rotary press stands still. That never happens; the press only stops when somebody stops it.","Night foreman Colthurst is found among the reels. That evening he had had eight pages set that nobody had ordered, and he meant to run them.","Four people were inside. The gate was locked; the key was hanging where it belongs."],"lijk":"Night foreman Colthurst\u2019s body was found in the press cellar.","cats":[{"key":"verdachte","label":"SUSPECTS","items":[{"naam":"Proofreader Vance","kort":"Vance","detail":"5 ft 6 \u00b7 left-handed \u00b7 grey eyes","ico":"<svg class=\"ico\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" focusable=\"false\"><title>Proofreader Vance<\/title><circle cx=\"7\" cy=\"13\" r=\"3.6\"/><circle cx=\"17\" cy=\"13\" r=\"3.6\"/><path d=\"M10.6 12.6h2.8\"/><path d=\"M3.4 11.4 5 7.6\"/><path d=\"M20.6 11.4 19 7.6\"/><\/svg>","tekst":"Nineteen years of taking other men\u2019s mistakes out. His own are in the margin of his own life."},{"naam":"Pressman Beckett","kort":"Beckett","detail":"6 ft 0 \u00b7 right-handed \u00b7 brown eyes","ico":"<svg class=\"ico\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" focusable=\"false\"><title>Pressman Beckett<\/title><path d=\"M2.6 15.4h15.4\"/><path d=\"M6 15.4a6 6 0 0 1 12 0\"/><path d=\"M18 15.4h2.6a1.4 1.4 0 0 1 0 2.8H18\"/><path d=\"M12 9.4v-3\"/><path d=\"M2.6 18.2h15.4\"/><\/svg>","tekst":"Works the rotary press the way a man works a horse. Black past the wrists, Sundays included."},{"naam":"Mrs Slaney","kort":"Slaney","detail":"5 ft 3 \u00b7 left-handed \u00b7 blue eyes","ico":"<svg class=\"ico\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" focusable=\"false\"><title>Mrs Slaney<\/title><rect x=\"4.6\" y=\"4.2\" width=\"14.8\" height=\"16.4\" rx=\"1.6\"/><rect x=\"9\" y=\"2.4\" width=\"6\" height=\"3.4\" rx=\"1\"/><path d=\"M8.4 10.4h7.2M8.4 13.8h7.2M8.4 17.2h4.4\"/><\/svg>","tekst":"Handles the wages, the post and the keys. So she knows exactly what everyone is worth."},{"naam":"Photographer Doyne","kort":"Doyne","detail":"5 ft ":"II","titel":"The Editorial Floor","nacht":"Night of the 19th to 20th of November","plek":"The Evening Sentinel newsroom, second floor","intro":["That afternoon Vosper, the editor-in-chief, had done two things: sent for Doyne\u2019s negatives, and let five people know he had them.","At half past one the red light in the darkroom is still burning. At half past two it is burning still, and nobody is answering the telephone.","Five people were in the building that night. All five say they never went up the stairs."],"lijk":"Vosper, the editor-in-chief, was found in the darkroom.","cats":[{"key":"verdachte","label":"SUSPECTS","items":[{"naam":"News Editor Haverstock","kort":"Haverstock","detail":"5 ft 11 \u00b7 right-handed \u00b7 brown eyes","ico":"<svg class=\"ico\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" focusable=\"false\"><title>News Editor Haverstock<\/title><path d=\"M3.6 16.4h16.8\"/><path d=\"M7 16.4c0-4.6 1-7.6 5-7.6s5 3 5 7.6\"/><path d=\"M7 13.6h10\"/><\/svg>","tekst":"Decides what goes on the front page. And therefore what never does."},{"naam":"Reporter Rendall","kort":"Rendall","detail":"5 ft 9 \u00b7 left-handed \u00b7 green eyes","ico":"<svg class=\"ico\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" focusable=\"false\"><title>Reporter Rendall<\/title><path d=\"M3.6 16.4h16.8\"/><path d=\"M7 16.4c0-4.6 1-7.6 5-7.6s5 3 5 7.6\"/><rect x=\"13.4\" y=\"10.6\" width=\"5.4\" height=\"3.6\" rx=\".6\"/><\/svg>","tekst":"Writes fast, drinks faster. Has one story he has never filed."},{"naam":"Telex Clerk Brimley","kort":"Brimley","detail":"5 ft 4 \u00b7 right-handed \u00b7 grey eyes","ico":"<svg class=\"ico\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-h e-linejoin=\"round\" aria-hidden=\"true\" focusable=\"false\"><title>the photographs<\/title><rect x=\"2.4\" y=\"7\" width=\"19.2\" height=\"10\" rx=\"1\"/><path d=\"M2.4 10h19.2M2.4 14h19.2\"/><path d=\"M5.4 7v3M9.4 7v3M13.4 7v3M17.4 7v3M5.4 14v3M9.4 14v3M13.4 14v3M17.4 14v3\"/><\/svg>","tekst":"Negatives with people on them who had no business being there."},{"naam":"Revenge","kort":"revenge","detail":"","ico":"<svg class=\"ico\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" focusable=\"false\"><title>revenge<\/title><path d=\"M13.4 2.6 5 13.4h6.2L9 21.4l8.4-10.8h-6.2z\"/><\/svg>","tekst":"Somebody has waited nineteen years for this night."},{"naam":"Fear","kort":"fear","detail":"","ico":"<svg class=\"ico\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" focusable=\"false\"><title>fear<\/title><path d=\"M2.2 12s4.2-6.2 9.8-6.2S21.8 12 21.8 12s-4.2 6.2-9.8 6.2S2.2 12 2.2 12z\"/><circle cx=\"12\" cy=\"12\" r=\"3.1\"/><circle cx=\"12\" cy=\"12\" r=\"1\"/><\/svg>","tekst":"Anyone who saw the last two nights knows what becomes of witnesses."}]}],"clues":["Mrs Slaney\u2019s motive was the photographs.","The suspect in the weighbridge hut was taller than the suspect whose motive was the photographs.","The suspect with the dispatch key ring was taller than the suspect whose motive was fear.","The shortest suspect did not carry a drum of stencil ink.","Whoever had revenge as a motive stood under 5 ft 4.","Proofreader Vance was not in the dispatch hall.","Whoever was in the dispatch hall stood over 5 ft 3.","Whoever carried a steel rule had the photographs as a motive.","The shortest suspect was not on the loading wharf."],"oplossing":[null,[2,3,1,0],[1,3,0,2],[0,1,3,2]],"dader":1,"onthulling":["Mrs Slaney handled the wages, the post and the keys. She handled the payments too: one to Doyne, one to Haverstock, both entered by hand against an account that does not exist.","In the fourth photograph of the black section it is she who stands there, in a car that is not hers, beside a man who bought a stretch of dockland four months later.","Grevill had the cash books with him. A steel rule is straight, cold and sharp on one edge \u2014 and the cut lies ten feet below the wharf."],"scene":"<svg class=\"scene strook\" viewBox=\"0 0 1000 260\" preserveAspectRatio=\"xMidYMid meet\" role=\"img\" aria-label=\"The loading wharf at night: a lamp above the water and a lorry in silhouette.\"><defs><radialGradient id=\"s-gloed\" cx=\".5\" cy=\".5\" r=\".5\"><stop offset=\"0\" stop-color=\"#ffe4a8\" stop-opacity=\".9\"/><stop offset=\"1\" stop-color=\"#ffe4a8\" stop-opacity=\"0\"/><\/radialGradient><radialGradient id=\"s-rood\" cx=\".5\" cy=\".5\" r=\".5\"><stop offset=\"0\" stop-color=\"#b8352b\" stop-opacity=\".75\"/><stop offset=\"1\" stop-color=\"#b8352b\" stop-opacity=\"0\"/><\/radialGradient><linearGradient id=\"s-bundel\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#9fc4dd\" stop-opacity=\".30\"/><stop offset=\"1\" stop-color=\"#9fc4dd\" stop-opacity=\"0\"/><\/linearGradient><linearGradient id=\"s-warmbundel\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#ffe4a8\" stop-opacity=\".26\"/><stop offset=\"1\" stop-color=\"#ffe4a8\" stop-opacity=\"0\"/><\/linearGradient><linearGradient id=\"s-lucht\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#22303a\"/><stop offset=\"1\" stop-color=\"#111a20\"/><\/linearGradient><radialGradient id=\"s-vignet\" cx=\".5\" cy=\".5\" r=\".72\"><stop offset=\".4\" stop-color=\"#000\" stop-opacity=\"0\"/><stop offset=\"1\" stop-color=\"#000\" stop-opacity=\".7\"/><\/radialGradient><\/defs><rect width=\"1000\" height=\"260\" fill=\"url(#s-lucht)\"/><ellipse cx=\"500\" cy=\"70\" rx=\"520\" ry=\"70\" fill=\"#334551\" opacity=\".35\"/><rect x=\"20 /* ───────────────────────── opslag (valt terug op geheugen) */
const Kluis = (function(){
  let mem = {};
  let ok = false;
  try { window.localStorage.setItem("__t","1"); window.localStorage.removeItem("__t"); ok = true; }
  catch(e){ ok = false; }
  return {
    lees(k){ try { return ok ? window.localStorage.getItem(k) : (mem[k]||null); } catch(e){ return mem[k]||null; } },
    schrijf(k,v){ try { if(ok) window.localStorage.setItem(k,v); else mem[k]=v; } catch(e){ mem[k]=v; } }
  };
})();
const SLEUTEL = "graveyardfiles_blackcolumn_en_v1";
let S = { versie:1, geluid:true, zaken:{} };
function laad(){
  try {
    const rauw = Kluis.lees(SLEUTEL);
    if(rauw){ const g = JSON.parse(rauw); if(g && g.versie === 1) S = g; }
  } catch(e){ /* corrupte opslag: verse staat */ }
  DATA.zaken.forEach(z => { if(!S.zaken[z.code]) S.zaken[z.code] = { grid:{}, af:[], opgelost:false, hints:0 }; });
}
function bewaar(){ try { Kluis.schrijf(SLEUTEL, JSON.stringify(S)); } catch(e){} }

/* ───────────────────────── geluid */
let AC = null;
function toon(freq, duur, type, vol){
  if(!S.geluid) return;
  try{
    if(!AC){ const C = window.AudioContext || window.webkitAudioContext; if(!C) return; AC = new C(); }
    if(AC.state === "suspended") AC.resume();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || "square"; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(vol || 0.05, AC.currentTime + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + (duur || 0.08));
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime + (duur || 0.08) + 0.02);
  }catch(e){}
}
const klik    = () => toon(1180, 0.04, "square", 0.035);
const zetVink = () => toon(660, 0.09, "triangle", 0.06);
const misser  = () => { toon(150, 0.22, "sawtooth", 0.05); };
const treffer = () => { toon(392,0.16,"triangle",0.06); setTimeout(()=>toon(523,0.16,"triangle",0.06),150);
                        setTimeout(()=>toon(659,0.3,"triangle",0.06),300); };

/* ───────────────────────── hulp */
const $  = s => document.querySelector(s);
const el = (t, k, tx) => { const n = document.createElement(t); if(k) n.className = k;
                           if(tx !== undefined) n.textContent = tx; return n; };
function alinea(doel, regels){
  doel.innerHTML = "";
  regels.forEach(r => doel.appendChild(el("p", null, r)));
}
function zaakVan(code){ return DATA.zaken.filter(z => z.code === code)[0]; }
function icoon(it, klasse){
  const h = document.createElement("span");
  h.innerHTML = (it.ico || "").replace('class="ico"', 'class="' + (klasse || "ico") + '"');
  return h.firstChild;
}
function kaart(it){
  const k = el("div", "kaart");
  const kop = el("div", "kop");
  const ic = icoon(it);
  if(ic) kop.appendChild(ic);
  kop.appendChild(el("span", "nm", it.naam));
  k.appendChild(kop);
  if(it.detail) k.appendChild(el("span", "dt", it.detail));
  k.appendChild(el("p", "om", it.tekst));
  return k;
}

/* oplossing: sol[c][p] = itemindex van categorie c voor verdachte p (c>=1) */
function hoortBij(z, r, c, i, j){
  if(c === 0) return z.oplossing[r][j] === i;
  for(let p = 0; p < z.cats[0].items.length; p++){
    if(z.oplossing[c][p] === j) return z.oplossing[r][p] === i;
  }
  return false;
}

/* ───────────────────────── kast */
function toonKast(){
  $("#serietitel").textContent = DATA.serie.titel;
  $("#serieonder").textContent = DATA.serie.onder;
  alinea($("#serie-intro"), DATA.serie.intro);
  alinea($("#serie-hoe"), DATA.serie.hoe);

  const lijst = $("#ladenlijst"); lijst.innerHTML = "";
  DATA.zaken.forEach((z, idx) => {
    const vorige = idx === 0 ? null : DATA.zaken[idx-1];
    const open = idx === 0 || S.zaken[vorige.code].opgelost;
    const b = el("button", "lade");
    b.type = "button";
    b.dataset.op = S.zaken[z.code].opgelost ? "1" : "0";
    b.disabled = !open;
    b.appendChild(el("span", "nr", "Case " + z.code));
    b.appendChild(el("span", "tt", z.titel));
    b.appendChild(el("span", "sub", open
      ? z.nacht + " · " + z.cats[0].items.length + " suspects · " + z.clues.length + " clues"
      : "locked — solve case " + vorige.code + " first"));
    b.addEventListener("click", () => { klik(); openZaak(z.code); });
    lijst.appendChild(b);
  });

  const ep = $("#epiloogblok"); ep.innerHTML = "";
  if(DATA.zaken.every(z => S.zaken[z.code].opgelost)){
    ep.appendChild(document.createElement("hr")).className = "rule";
    const k = el("p", "eyebrow", "Epilogue"); ep.appendChild(k);
    DATA.epiloog.forEach(r => ep.appendChild(el("p", null, r)));
  }
  kolomBij();
  wissel("#scherm-kast");
}
function kolomBij(){
  const k = $("#kolom"); k.innerHTML = "";
  DATA.zaken.forEach(z => {
    const s = el("div", "seg" + (S.zaken[z.code].opgelost ? " vol" : ""));
    k.appendChild(s);
  });
}
function wissel(sel){
  document.querySelectorAll(".scherm").forEach(s => s.classList.remove("actief"));
  $(sel).classList.add("actief");
  $("#blad").scrollTop = 0;
}

/* ───────────────────────── zaak */
let huidig = null;
function openZaak(code){
  huidig = zaakVan(code);
  const z = huidig, st = S.zaken[code];
  $("#z-nacht").textContent = z.nacht;
  $("#z-titel").textContent = "Case " + z.code + " · " + z.titel;
  $("#z-plek").textContent = z.plek;
  $("#z-scene").innerHTML = z.scene || "";
  alinea($("#z-intro"), z.intro);

  const vd = $("#z-verdachten"); vd.innerHTML = "";
  z.cats[0].items.forEach(p => vd.appendChild(kaart(p)));

  const cb = $("#z-categorieen"); cb.innerHTML = "";
  z.cats.slice(1).forEach(cat => {
    cb.appendChild(el("h3", null, cat.label.charAt(0) + cat.label.slice(1).toLowerCase()));
    const g = el("div", "kaarten");
    cat.items.forEach(it => g.appendChild(kaart(it)));
    cb.appendChild(g);
  });

  const ol = $("#z-clues"); ol.innerHTML = "";
  z.clues.forEach((c, i) => {
    const li = el("li", st.af.indexOf(i) >= 0 ? "af" : null, c);
    li.addEventListener("click", () => {
      klik();
      const p = st.af.indexOf(i);
      if(p >= 0) st.af.splice(p, 1); else st.af.push(i);
      li.className = st.af.indexOf(i) >= 0 ? "af" : "";
      bewaar();
    });
    ol.appendChild(li);
  });
  const lijk = el("li", "lijk", z.lijk);
  ol.appendChild(lijk);

  bouwRooster();
  bouwVelden();
  $("#z-uitslag").className = "uitslag";
  $("#onthulling").className = st.opgelost ? "zicht" : "";
  if(st.opgelost) vulOnthulling();
  $("#hintknop").disabled = st.hints >= 2 || st.opgelost;
  $("#hintknop").textContent = "release an exhibit (" + (2 - st.hints) + ")";
  wissel("#scherm-zaak");
}

/* ───────────────────────── rooster */
function bouwRooster(){
  const z = huidig, tb = $("#z-rooster"), N = z.cats[0].items.length, K = z.cats.length;
  tb.innerHTML = "";
  const kolCats = [], rijCats = [];
  for(let c = 0; c < K - 1; c++) kolCats.push(c);
  for(let r = 1; r < K; r++) rijCats.push(r);

  const rTop = el("tr");
  rTop.appendChild(el("td", "hoek"));
  kolCats.forEach(c => {
    const td = el("td", "catlabel", z.cats[c].label);
    td.colSpan = N; td.style.textAlign = "center";
    rTop.appendChild(td);
  });
  tb.appendChild(rTop);

  const rKop = el("tr");
  rKop.appendChild(el("td", "hoek"));
  kolCats.forEach(c => z.cats[c].items.forEach(it => {
    const td = el("td", "kolabel");
    td.title = it.naam;
    const ic = icoon(it);
    if(ic) td.appendChild(ic);
    td.appendChild(el("span", "tx", it.kort));
    rKop.appendChild(td);
  }));
  tb.appendChild(rKop);

  rijCats.forEach(r => {
    const rc = el("tr");
    const td = el("td", "catlabel", z.cats[r].label);
    td.colSpan = 1 + kolCats.length * N;
    td.style.paddingTop = "6px";
    rc.appendChild(td);
    tb.appendChild(rc);

    z.cats[r].items.forEach((it, i) => {
      const tr = el("tr");
      const rl = el("td", "rijlabel");
      rl.title = it.naam;
      const rin = el("div", "in");
      rin.appendChild(el("span", "lb", it.kort));
      const ric = icoon(it);
      if(ric) rin.appendChild(ric);
      rl.appendChild(rin);
      tr.appendChild(rl);
      kolCats.forEach(c => {
        z.cats[c].items.forEach((_, j) => {
          if(c >= r){ tr.appendChild(el("td", "hoek")); return; }
          const cel = el("td", "cel"
            + (j === 0 && c > 0 ? " bl" : "")
            + (i === 0 && r > 1 ? " bt" : ""));
          cel.dataset.k = r + "_" + c + "_" + i + "_" + j;
          cel.dataset.rand = (j === 0 && c > 0 ? "l" : "") + (i === 0 && r > 1 ? "t" : "");
          cel.setAttribute("role", "button");
          cel.tabIndex = 0;
          cel.addEventListener("click", () => wisselCel(cel));
          cel.addEventListener("keydown", e => {
            if(e.key === "Enter" || e.key === " "){ e.preventDefault(); wisselCel(cel); }
          });
          tr.appendChild(cel);
        });
      });
      tb.appendChild(tr);
    });
  });
  tekenRooster();
}
function tekenRooster(){
  const g = S.zaken[huidig.code].grid;
  document.querySelectorAll("#z-rooster .cel").forEach(cel => {
    const w = g[cel.dataset.k] || 0;
    const rand = cel.dataset.rand || "";
    cel.textContent = w === 1 ? "✗" : (w === 2 ? "✓" : "");
    cel.className = "cel" + (w === 2 ? " v" : "")
      + (rand.indexOf("l") >= 0 ? " bl" : "") + (rand.indexOf("t") >= 0 ? " bt" : "");
  });
}
function zet(k, w){ const g = S.zaken[huidig.code].grid; if(w === 0) delete g[k]; else g[k] = w; }
function wisselCel(cel){
  if(S.zaken[huidig.code].opgelost) return;
  const g = S.zaken[huidig.code].grid, k = cel.dataset.k;
  const w = ((g[k] || 0) + 1) % 3;
  zet(k, w);
  if(w === 2){ streepWeg(k); zetVink(); } else klik();
  tekenRooster(); bewaar();
}
function streepWeg(k){
  const d = k.split("_"), r = +d[0], c = +d[1], i = +d[2], j = +d[3];
  const N = huidig.cats[0].items.length;
  for(let x = 0; x < N; x++){
    if(x !== j){ const kk = r+"_"+c+"_"+i+"_"+x; if(!S.zaken[huidig.code].grid[kk]) zet(kk, 1); }
    if(x !== i){ const kk = r+"_"+c+"_"+x+"_"+j; if(!S.zaken[huidig.code].grid[kk]) zet(kk, 1); }
  }
}

/* ───────────────────────── beschuldiging */
function bouwVelden(){
  const z = huidig, box = $("#z-velden"); box.innerHTML = "";
  const vragen = [{ci:0, label:"Who?"}];
  z.cats.forEach((c, idx) => {
    if(idx === 0) return;
    vragen.push({ci:idx, label:c.key === "wapen" ? "With what?" : (c.key === "locatie" ? "Where?" : "Why?")});
  });
  vragen.forEach(v => {
    const rij = el("div", "veld");
    const lab = el("label", null, v.label);
    lab.htmlFor = "sel" + v.ci;
    const sel = document.createElement("select");
    sel.id = "sel" + v.ci;
    sel.appendChild(new Option("— choose —", ""));
    z.cats[v.ci].items.forEach((it, ix) => sel.appendChild(new Option(it.naam, String(ix))));
    if(S.zaken[z.code].opgelost){
      sel.value = String(v.ci === 0 ? z.dader : z.oplossing[v.ci][z.dader]);
      sel.disabled = true;
    }
    rij.appendChild(lab); rij.appendChild(sel);
    box.appendChild(rij);
  });
}
function beschuldig(){
  const z = huidig, st = S.zaken[z.code];
  if(st.opgelost) return;
  const keuzes = [];
  let compleet = true;
  z.cats.forEach((c, idx) => {
    const sel = $("#sel" + idx);
    if(!sel) return;
    if(sel.value === "") compleet = false;
    keuzes[idx] = sel.value === "" ? -1 : +sel.value;
  });
  const u = $("#z-uitslag");
  u.className = "uitslag zicht";
  if(!compleet){
    u.textContent = "Fill in every part of the charge first.";
    misser(); return;
  }
  let goed = keuzes[0] === z.dader;
  z.cats.forEach((c, idx) => { if(idx > 0 && keuzes[idx] !== z.oplossing[idx][z.dader]) goed = false; });
  if(!goed){
    u.textContent = "This charge will not stand. At least one clue contradicts it — "
                  + "go back over the grid and find the line you have not used yet.";
    misser(); return;
  }
  st.opgelost = true;
  bewaar(); treffer();
  u.className = "uitslag";
  bouwVelden();
  vulOnthulling();
  $("#onthulling").className = "zicht";
  $("#hintknop").disabled = true;
  kolomBij();
  setTimeout(() => { $("#onthulling").scrollIntoView({block:"start"}); }, 120);
}
function vulOnthulling(){
  const z = huidig;
  const regels = [];
  regels.push("<b>Who</b> " + z.cats[0].items[z.dader].naam);
  z.cats.forEach((c, idx) => {
    if(idx === 0) return;
    const lb = c.key === "wapen" ? "With what" : (c.key === "locatie" ? "Where" : "Why");
    regels.push("<b>" + lb + "</b> " + c.items[z.oplossing[idx][z.dader]].naam);
  });
  $("#z-oplos").innerHTML = regels.join("<br>");
  alinea($("#z-onthul"), z.onthulling);
  const idx = DATA.zaken.map(x => x.code).indexOf(z.code);
  const knop = $("#volgende");
  knop.textContent = idx < DATA.zaken.length - 1 ? "next case drawer" : "close the file";
}

/* ───────────────────────── hint */
function hint(){
  const z = huidig, st = S.zaken[z.code];
  if(st.hints >= 2 || st.opgelost) return;
  const kans = [];
  const N = z.cats[0].items.length;
  for(let r = 1; r < z.cats.length; r++){
    for(let c = 0; c < r; c++){
      for(let i = 0; i < N; i++){
        for(let j = 0; j < N; j++){
          const k = r+"_"+c+"_"+i+"_"+j;
          if(hoortBij(z, r, c, i, j) && st.grid[k] !== 2) kans.push(k);
        }
      }
    }
  }
  if(!kans.length) return;
  const k = kans[Math.floor(Math.random() * kans.length)];
  zet(k, 2); streepWeg(k);
  st.hints++;
  bewaar(); tekenRooster(); zetVink();
  $("#hintknop").textContent = "release an exhibit (" + (2 - st.hints) + ")";
  $("#hintknop").disabled = st.hints >= 2;
  const u = $("#z-uitslag");
  u.className = "uitslag zicht";
  u.textContent = "One square has been filled in for you. The rest of that row and column is crossed out.";
}

/* ───────────────────────── init */
function init(){
  laad();
  $("#terugknop").addEventListener("click", () => { klik(); toonKast(); });
  $("#beschuldig").addEventListener("click", beschuldig);
  $("#hintknop").addEventListener("click", () => { klik(); hint(); });
  $("#wisknop").addEventListener("click", () => {
    if(!huidig || S.zaken[huidig.code].opgelost) return;
    S.zaken[huidig.code].grid = {};
    bewaar(); tekenRooster(); klik();
  });
  $("#volgende").addEventListener("click", () => {
    klik();
    const idx = DATA.zaken.map(x => x.code).indexOf(huidig.code);
    if(idx < DATA.zaken.length - 1) openZaak(DATA.zaken[idx+1].code); else toonKast();
  });
  const gk = $("#geluidknop");
  gk.textContent = "sound: " + (S.geluid ? "on" : "off");
  gk.addEventListener("click", () => {
    S.geluid = !S.geluid; bewaar();
    gk.textContent = "sound: " + (S.geluid ? "on" : "off");
    if(S.geluid) klik();
  });
  toonKast();
}
window.__zwartekolom = { DATA, get S(){ return S; }, init, openZaak, beschuldig, hint,
                         bouwRooster, tekenRooster, wisselCel, hoortBij, toonKast };
init();
</script>
